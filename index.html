<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"

  <title>Welcome Event Map</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js" defer></script>

<body>
  <header class="site-header">
    <h1 class="site-title">Welcome Event Map</h1>

  <main>
    <nav class="venue-tabs" aria-label="Choose a date">
      <button
        class="venue-tab is-active"
        type="button"
        data-venue="first"
        aria-selected="true"
      >
        10/03
      </button>

      <button
        class="venue-tab"
        type="button"
        data-venue="second"
        aria-selected="false"
      >
        10/05
      </button>
    </nav>

    <section class="search-section">
      <label class="search-box">
        <img
          class="search-icon-image"
          src="images/search.png"
          alt=""
          aria-hidden="true"
        >
        <input
          id="organisationSearch"
          type="search"
          placeholder="団体を検索する"
          autocomplete="off"
          aria-label="Search for an organisation"
        >

      </label>

      <p
        id="searchMessage"
        class="search-message"
        aria-live="polite"
      ></p>
    </section>

  <div id="roomPopup" class="popup-overlay" hidden>

      class="room-popup"
      role="dialog"
      aria-modal="true"
      aria-labelledby="popupRoomName"
    >

        id="closePopupButton"
        class="popup-close"
        type="button"
        aria-label="Close the room information"
      >
        ×
      </button>

      <h2 id="popupRoomName" class="popup-title">Room</h2>

      <p id="popupCondition" class="popup-condition"></p>

      <div
        id="popupOrganisationList"
        class="organisation-list"
      ></div>

      <a
        id="roomPageLink"
        class="room-link-button"
        href="room.html"

        Go to room
      </a>
    </section>

      class="organisation-popup"
      role="dialog"
      aria-modal="true"
      aria-labelledby="popupOrganisationName"
    >
      <button
        id="closeOrganisationPopupButton"
        class="popup-close"
        type="button"
        aria-label="Close organisation information"

      </button>

      <h2 id="popupOrganisationName" class="popup-title">
        Organisation
      </h2>

      <p id="popupBoothName" class="popup-room-name"></p>

      <img
        id="popupStampImage"
        class="popup-stamp-image"
        src=""
        alt=""
        hidden
      >

      <a
        id="organisationWebsiteLink"
        class="popup-button popup-link-button"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        団体ウェブサイトを開く
      </a>

      <button
        id="readNfcButton"
        class="popup-button nfc-button"
        type="button"
